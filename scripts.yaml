# Home Assistant scripts (YAML)
# Wartungs-Tap auf Übersicht: Lovelace kann keine Templates in tap_action.

wartung_befeuchter_reinigung_vermerken:
  alias: Wartung Befeuchter Reinigung vermerken
  mode: single
  sequence:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.letzte_reinigung_befeuchter
      data:
        timestamp: "{{ as_timestamp(now()) | int }}"

wartung_luefterfilter_vermerken:
  alias: Wartung Lüfterfilter vermerken
  mode: single
  sequence:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.letzte_wartung_luefterfilter
      data:
        timestamp: "{{ as_timestamp(now()) | int }}"

system_ausstehende_updates_installieren:
  alias: System ausstehende Updates installieren
  description: Installiert alle update.*-Entities mit state on (HACS, Firmware, …).
  mode: restart
  sequence:
    - repeat:
        for_each: >
          {% set ns = namespace(ids=[]) %}
          {% for e in states.update %}
            {% if e.state == 'on' and not e.attributes.get('in_progress') %}
              {% set ns.ids = ns.ids + [e.entity_id] %}
            {% endif %}
          {% endfor %}
          {{ ns.ids }}
        sequence:
          - action: update.install
            target:
              entity_id: "{{ repeat.item }}"
          - delay: "00:00:05"

# --- EG Licht: Drehregler & Raum-Schalter (docs/licht-eg-anforderungen.md) ---

licht_ess_drehregler_helligkeit:
  alias: Licht Ess Drehregler Helligkeit
  description: Mappt action_level (1–249/null) auf dimmbare Ess-Lichter.
  mode: queued
  max: 10
  fields:
    action_level:
      description: MQTT action_level vom Drehregler (null = Maximum)
      example: 214
  sequence:
    - variables:
        ess_dimmbar:
          - light.licht_eg_esszimmer_lang
          - light.licht_eg_esszimmer_spot1
          - light.licht_eg_esszimmer_spot2
          - light.licht_eg_esszimmer_spot3
          - light.licht_eg_esszimmer_spot4
        ziel_helligkeit: >
          {% if action_level is none or action_level in ['null', 'None', ''] %}
            255
          {% else %}
            {{ action_level | int(1) }}
          {% endif %}
        ziel_kelvin: >
          {% set an = expand(ess_dimmbar) | selectattr('state', 'eq', 'on') | list %}
          {% if an %}
            {% set a = an[0].attributes %}
            {% if a.color_temp_kelvin is number %}{{ a.color_temp_kelvin | int }}
            {% elif a.color_temp is number %}{{ (1000000 / a.color_temp) | int }}
            {% else %}4000{% endif %}
          {% else %}4000{% endif %}
    - action: light.turn_on
      target:
        entity_id: "{{ ess_dimmbar }}"
      data:
        brightness: "{{ ziel_helligkeit }}"
        color_temp_kelvin: "{{ ziel_kelvin }}"
        transition: 0.5

licht_ess_drehregler_klick:
  alias: Licht Ess Drehregler Klick
  description: Toggle dimmbare Ess-Lichter nach HA-Zustand; action on/off ignorieren.
  mode: single
  fields:
    action_level:
      description: MQTT action_level als Helligkeit beim Einschalten
      example: 240
  sequence:
    - variables:
        ess_dimmbar:
          - light.licht_eg_esszimmer_lang
          - light.licht_eg_esszimmer_spot1
          - light.licht_eg_esszimmer_spot2
          - light.licht_eg_esszimmer_spot3
          - light.licht_eg_esszimmer_spot4
        ziel_helligkeit: >
          {% if action_level is none or action_level in ['null', 'None', ''] %}
            255
          {% else %}
            {{ action_level | int(1) }}
          {% endif %}
        irgendeins_an: >
          {{ expand(ess_dimmbar) | selectattr('state', 'eq', 'on') | list | length > 0 }}
        ziel_kelvin: >
          {% set an = expand(ess_dimmbar) | selectattr('state', 'eq', 'on') | list %}
          {% if an %}
            {% set a = an[0].attributes %}
            {% if a.color_temp_kelvin is number %}{{ a.color_temp_kelvin | int }}
            {% elif a.color_temp is number %}{{ (1000000 / a.color_temp) | int }}
            {% else %}4000{% endif %}
          {% else %}4000{% endif %}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ irgendeins_an }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ ess_dimmbar }}"
        - conditions: []
          sequence:
            - action: light.turn_on
              target:
                entity_id: "{{ ess_dimmbar }}"
              data:
                brightness: "{{ ziel_helligkeit }}"
                color_temp_kelvin: "{{ ziel_kelvin }}"
                transition: 0.5

