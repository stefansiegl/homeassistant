haus_muell_info:
  alias: Müllabfuhr Info
  description: Sagt an, wann welche Mülltonne abgeholt wird (Sprachsteuerung)
  icon: mdi:trash-can-outline
  mode: single
  sequence:
    - variables:
        nachricht: >-
          {%- set bins = [
            ('Restmüll', state_attr('sensor.waste_rest_days', 'daysTo') | int(99)),
            ('Gelbe Tonne', state_attr('sensor.waste_gelb_days', 'daysTo') | int(99)),
            ('Biotonne', state_attr('sensor.waste_bio_days', 'daysTo') | int(99)),
            ('Papiertonne', state_attr('sensor.waste_papier_days', 'daysTo') | int(99))
          ] -%}
          {%- set parts = [] -%}
          {%- for name, days in bins -%}
            {%- if days <= 14 -%}
              {%- if days == 0 -%}
                {%- set parts = parts + [name ~ ' heute'] -%}
              {%- elif days == 1 -%}
                {%- set parts = parts + [name ~ ' morgen'] -%}
              {%- else -%}
                {%- set parts = parts + [name ~ ' in ' ~ days ~ ' Tagen'] -%}
              {%- endif -%}
            {%- endif -%}
          {%- endfor -%}
          {%- if parts | length == 0 -%}
          In den nächsten zwei Wochen ist keine Müllabholung eingetragen.
          {%- else -%}
          Müllabfuhr: {{ parts | join(', ') }}.
          {%- endif -%}
    - action: tts.speak
      target:
        entity_id: media_player.benachrichtigung_lautsprecher
      data:
        cache: false
        media_player_entity_id: media_player.benachrichtigung_lautsprecher
        message: "{{ nachricht }}"

haus_strom_info:
  alias: Strom Info
  description: Stromverbrauch und -kosten (Sprachsteuerung)
  icon: mdi:flash
  mode: single
  sequence:
    - variables:
        nachricht: >-
          {%- set leistung = states('sensor.mt691_power_cur_stabil') | float(0) | round(0) -%}
          {%- set bezug = states('sensor.mt691_total_in_stabil') | float(0) | round(0) -%}
          {%- set einspeis = states('sensor.mt691_total_out_stabil') | float(0) | round(0) -%}
          {%- set kosten = states('sensor.strom_bezug_stabil_kosten') | float(0) | round(2) -%}
          {%- set verguetung = states('sensor.strom_einspeisung_stabil_vergutung') | float(0) | round(2) -%}
          Aktuell werden {{ leistung }} Watt bezogen.
          Stromzähler: {{ bezug }} Kilowattstunden Bezug, {{ einspeis }} Kilowattstunden Einspeisung.
          Stromkosten bisher {{ '%.2f' | format(kosten) | replace('.', ',') }} Euro.
          Einspeisevergütung bisher {{ '%.2f' | format(verguetung) | replace('.', ',') }} Euro.
    - action: tts.speak
      target:
        entity_id: media_player.benachrichtigung_lautsprecher
      data:
        cache: false
        media_player_entity_id: media_player.benachrichtigung_lautsprecher
        message: "{{ nachricht }}"

haus_energie_info:
  alias: Energie Info
  description: Strom, Wasser, Gas und Kosten (Sprachsteuerung)
  icon: mdi:home-lightning-bolt-outline
  mode: single
  sequence:
    - variables:
        nachricht: >-
          {%- set leistung = states('sensor.mt691_power_cur_stabil') | float(0) | round(0) -%}
          {%- set bezug = states('sensor.mt691_total_in_stabil') | float(0) | round(0) -%}
          {%- set strom_k = states('sensor.strom_bezug_stabil_kosten') | float(0) | round(2) -%}
          {%- set wasser = states('sensor.watermeter_value_stabil') | float(0) | round(1) -%}
          {%- set wasser_k = states('sensor.watermeter_stabil_kosten') | float(0) | round(2) -%}
          {%- set gas = states('sensor.gasmeter_value_stabil') | float(0) | round(1) -%}
          {%- set gas_k = states('sensor.gasmeter_stabil_kosten') | float(0) | round(2) -%}
          Energie-Überblick:
          Strom aktuell {{ leistung }} Watt, Zählerstand {{ bezug }} Kilowattstunden Bezug,
          Kosten {{ '%.2f' | format(strom_k) | replace('.', ',') }} Euro.
          Wasser {{ wasser }} Kubikmeter, Kosten {{ '%.2f' | format(wasser_k) | replace('.', ',') }} Euro.
          Gas {{ gas }} Kubikmeter, Kosten {{ '%.2f' | format(gas_k) | replace('.', ',') }} Euro.
    - action: tts.speak
      target:
        entity_id: media_player.benachrichtigung_lautsprecher
      data:
        cache: false
        media_player_entity_id: media_player.benachrichtigung_lautsprecher
        message: "{{ nachricht }}"

wasser_stabil_korrigieren:
  alias: 'Wasser: Stabil auf OCR-Stand setzen'
  description: >-
    Setzt watermeter_value_stabil auf den aktuellen OCR-Wert (nach Abgleich am
    physischen Zähler). Einmalig bei falschem Stabil-Stand.
  icon: mdi:water-sync
  mode: single
  sequence:
    - condition: template
      value_template: >-
        {{ states('sensor.watermeter_value') not in ['unknown', 'unavailable', 'none', '']
           and states('sensor.watermeter_error') == 'no error' }}
    - action: input_number.set_value
      target:
        entity_id: input_number.watermeter_stabil_korrektur
      data:
        value: "{{ states('sensor.watermeter_value') | float(0) }}"
    - action: homeassistant.update_entity
      target:
        entity_id: sensor.watermeter_value_stabil
