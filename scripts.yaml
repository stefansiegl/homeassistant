garten_hitzeprofil:
  alias: Garten Hitze-Profil
  description: Beet-Ziel 42 %, mehr Tropf-Läufe, kürzere Sperre — für heiße Tage (docs/garten-bewaesserung.md)
  icon: mdi:weather-sunny-alert
  mode: single
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.garten_schwellwert_beet
      data:
        value: 42
    - action: input_number.set_value
      target:
        entity_id: input_number.garten_tropf_sperre_stunden
      data:
        value: 3
    - action: input_number.set_value
      target:
        entity_id: input_number.garten_tropf_max_laeufe_tag
      data:
        value: 5
    - action: input_number.set_value
      target:
        entity_id: input_number.garten_tropf_dauer_tag_minuten
      data:
        value: 35
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.garten_tropf_automatisch
    - if:
      - condition: template
        value_template: >
          {% set beet = states('sensor.gw1100a_soil_moisture_5') %}
          {% set zb = states('input_number.garten_schwellwert_beet') | float(42) %}
          {{ beet not in ['unknown', 'unavailable', 'none', ''] and beet | float(100) < zb
             and not is_state('script.garten_tropf_bewaessern', 'on')
             and not is_state('valve.ventil_garten_tropf_hecke_beet', 'open') }}
      then:
      - action: script.garten_tropf_bewaessern
        data:
          dauer_minuten: "{{ states('input_number.garten_tropf_dauer_tag_minuten') | int(35) }}"
    - action: notify.mobile_app_pixel_9_pro
      data:
        title: Garten Hitze-Profil
        message: >-
          Beet-Schwellwert 42 %, max 5 Tropf-Läufe/Tag, Sperre 3 h, Tag-Dauer 35 Min.
          {% if is_state('script.garten_tropf_bewaessern', 'on') or is_state('valve.ventil_garten_tropf_hecke_beet', 'open') %}
          Tropf läuft jetzt nach.
          {% endif %}

garten_tropf_limit_alarm:
  alias: Tropf Limit / Alarm
  description: Stoppt Tropf, schaltet Auto aus, Push (docs/garten-bewaesserung.md)
  icon: mdi:alert
  mode: single
  sequence:
    - action: script.turn_off
      target:
        entity_id: script.garten_tropf_bewaessern
    - action: valve.close_valve
      target:
        entity_id: valve.ventil_garten_tropf_hecke_beet
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.garten_tropf_automatisch
    - action: notify.mobile_app_pixel_9_pro
      data:
        title: "Tropf — bitte prüfen"
        message: >-
          Tropf-Tageslimit ({{ states('counter.garten_tropf_laeufe_heute') }}/{{ states('input_number.garten_tropf_max_laeufe_tag') | int(3) }})
          oder Sicherheitsstopp. Auto aus. Beet/Hecke und Ventil checken.
        data:
          push:
            sound: default
            interruption-level: time-sensitive
    - action: persistent_notification.create
      data:
        notification_id: garten_tropf_limit
        title: Tropf — bitte prüfen
        message: >-
          Tageslimit oder Sicherheitsstopp. Schalter „Tropf automatisch“ wurde ausgeschaltet.
          Läufe heute: {{ states('counter.garten_tropf_laeufe_heute') }}.

garten_tropf_bewaessern:
  alias: Tropfschlauch an
  description: Tropf Zone C mit Dauer-Feld, Sperre und Tageslimit (docs/garten-bewaesserung.md)
  icon: mdi:water-pump
  mode: restart
  fields:
    dauer_minuten:
      name: Dauer (Minuten)
      description: Leer = Helper Morgen/Abend
      example: 30
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: min
  sequence:
    - variables:
        dauer: >-
          {% if dauer_minuten is defined and dauer_minuten not in [none, '', 'none', 'None'] %}
            {{ dauer_minuten | int(45) }}
          {% else %}
            {{ states('input_number.garten_tropf_dauer_minuten') | int(45) }}
          {% endif %}
        laeufe: "{{ states('counter.garten_tropf_laeufe_heute') | int(0) }}"
        max_l: "{{ states('input_number.garten_tropf_max_laeufe_tag') | int(5) }}"
    - if:
      - condition: template
        value_template: "{{ laeufe | int >= max_l | int }}"
      then:
      - action: script.garten_tropf_limit_alarm
      - stop: Tageslimit erreicht
    - if:
      - condition: template
        value_template: >
          {% set last = states('input_datetime.garten_tropf_letzte_bewaesserung') %}
          {% if last in ['unknown', 'unavailable', 'none', ''] %}
            false
          {% else %}
            {{ (as_timestamp(now()) - as_timestamp(last))
               <= (states('input_number.garten_tropf_sperre_stunden') | float(4) * 3600) }}
          {% endif %}
      then:
      - stop: Sperre aktiv — zu früh nach letztem Lauf
    - action: counter.increment
      target:
        entity_id: counter.garten_tropf_laeufe_heute
    - action: valve.open_valve
      target:
        entity_id: valve.ventil_garten_tropf_hecke_beet
    - delay:
        minutes: "{{ dauer | int(45) }}"
    - action: valve.close_valve
      target:
        entity_id: valve.ventil_garten_tropf_hecke_beet
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.garten_tropf_letzte_bewaesserung
      data:
        timestamp: "{{ as_timestamp(now()) | int }}"

garten_rasen_gross_bewaessern:
  alias: Rasensprenger an
  description: Zone A — großer Regner (docs/garten-bewaesserung.md)
  icon: mdi:sprinkler
  mode: restart
  sequence:
    - action: valve.open_valve
      target:
        entity_id: valve.ventil_garten_rasen_gross
    - delay:
        minutes: "{{ states('input_number.garten_rasen_dauer_minuten') | int(20) }}"
    - action: valve.close_valve
      target:
        entity_id: valve.ventil_garten_rasen_gross

garten_rasen_klein_bewaessern:
  alias: Versenkregner an
  description: Zone B — zwei kleine Regner (docs/garten-bewaesserung.md)
  icon: mdi:sprinkler-variant
  mode: restart
  sequence:
    - action: valve.open_valve
      target:
        entity_id: valve.ventil_garten_rasen_klein
    - delay:
        minutes: "{{ states('input_number.garten_rasen_dauer_minuten') | int(20) }}"
    - action: valve.close_valve
      target:
        entity_id: valve.ventil_garten_rasen_klein

garten_rasen_bewaessern:
  alias: Rasen beide Zonen
  description: Zone A dann B nacheinander, kein Tropf (docs/garten-bewaesserung.md)
  icon: mdi:sprinkler
  mode: single
  sequence:
    - condition: template
      value_template: >
        {{ not is_state('script.garten_tropf_bewaessern', 'on')
           and not is_state('valve.ventil_garten_tropf_hecke_beet', 'open') }}
    - action: script.garten_rasen_gross_bewaessern
    - action: script.garten_rasen_klein_bewaessern

garten_morgen_bewaessern:
  alias: Garten morgens (Regner + Tropf bei Bedarf)
  description: Zone A/B immer zeitgesteuert; Tropf bei trockenem Beet/Hecke (docs/garten-bewaesserung.md)
  icon: mdi:weather-sunset-up
  mode: single
  sequence:
    - condition: template
      value_template: >
        {{ not is_state('script.garten_rasen_gross_bewaessern', 'on')
           and not is_state('script.garten_rasen_klein_bewaessern', 'on')
           and not is_state('script.garten_tropf_bewaessern', 'on')
           and not is_state('valve.ventil_garten_rasen_gross', 'open')
           and not is_state('valve.ventil_garten_rasen_klein', 'open')
           and not is_state('valve.ventil_garten_tropf_hecke_beet', 'open') }}
    - action: script.garten_rasen_gross_bewaessern
    - action: script.garten_rasen_klein_bewaessern
    - if:
      - condition: template
        value_template: >
          {% set beet = states('sensor.gw1100a_soil_moisture_5') %}
          {% set hecke = states('sensor.gw1100a_soil_moisture_6') %}
          {% set zb = states('input_number.garten_schwellwert_beet') | float(42) %}
          {% set zh = states('input_number.garten_schwellwert_hecke') | float(35) %}
          {% set beet_trocken = beet not in ['unknown', 'unavailable', 'none', ''] and beet | float(100) < zb %}
          {% set hecke_trocken = hecke not in ['unknown', 'unavailable', 'none', ''] and hecke | float(100) < zh %}
          {{ beet_trocken or hecke_trocken }}
      then:
      - action: script.garten_tropf_bewaessern

garten_rasen_gross_aus:
  alias: Rasensprenger aus
  description: Stoppt Viereckregner und schließt Ventil Zone A (Sprachsteuerung)
  icon: mdi:sprinkler-off
  mode: single
  sequence:
    - action: script.turn_off
      target:
        entity_id: script.garten_rasen_gross_bewaessern
    - action: valve.close_valve
      target:
        entity_id: valve.ventil_garten_rasen_gross

garten_rasen_klein_aus:
  alias: Versenkregner aus
  description: Stoppt Versenkregner und schließt Ventil Zone B (Sprachsteuerung)
  icon: mdi:sprinkler-off
  mode: single
  sequence:
    - action: script.turn_off
      target:
        entity_id: script.garten_rasen_klein_bewaessern
    - action: valve.close_valve
      target:
        entity_id: valve.ventil_garten_rasen_klein

garten_tropf_aus:
  alias: Tropfschlauch aus
  description: Stoppt Tropfbewässerung und schließt Ventil Zone C (Sprachsteuerung)
  icon: mdi:pipe-valve
  mode: single
  sequence:
    - action: script.turn_off
      target:
        entity_id: script.garten_tropf_bewaessern
    - action: valve.close_valve
      target:
        entity_id: valve.ventil_garten_tropf_hecke_beet

garten_bewaesserung_aus:
  alias: Garten Bewässerung aus
  description: Stoppt alle Garten-Bewässerungen und schließt alle Ventile (Sprachsteuerung)
  icon: mdi:water-off
  mode: single
  sequence:
    - action: script.turn_off
      target:
        entity_id:
          - script.garten_morgen_bewaessern
          - script.garten_rasen_bewaessern
          - script.garten_rasen_gross_bewaessern
          - script.garten_rasen_klein_bewaessern
          - script.garten_tropf_bewaessern
    - action: valve.close_valve
      target:
        entity_id:
          - valve.ventil_garten_rasen_gross
          - valve.ventil_garten_rasen_klein
          - valve.ventil_garten_tropf_hecke_beet
garten_bewaesserung_status:
  alias: Läuft Bewässerung
  description: Sagt an, welche Garten-Bewässerung gerade läuft (Sprachsteuerung)
  icon: mdi:information-outline
  mode: single
  sequence:
    - variables:
        nachricht: >-
          {%- set gross = is_state('valve.ventil_garten_rasen_gross', 'open')
              or is_state('script.garten_rasen_gross_bewaessern', 'on') -%}
          {%- set klein = is_state('valve.ventil_garten_rasen_klein', 'open')
              or is_state('script.garten_rasen_klein_bewaessern', 'on') -%}
          {%- set tropf = is_state('valve.ventil_garten_tropf_hecke_beet', 'open')
              or is_state('script.garten_tropf_bewaessern', 'on') -%}
          {%- if not gross and not klein and not tropf -%}
          Im Garten läuft gerade keine Bewässerung.
          {%- else -%}
          Im Garten läuft
          {%- if gross %} der große Rasensprenger{% endif -%}
          {%- if klein %}{% if gross %} und{% endif %} der Versenkregner{% endif -%}
          {%- if tropf %}{% if gross or klein %} und{% endif %} der Tropfschlauch{% endif -%}
          .
          {%- endif -%}
    - action: tts.speak
      target:
        entity_id: media_player.benachrichtigung_lautsprecher
      data:
        cache: false
        media_player_entity_id: media_player.benachrichtigung_lautsprecher
        message: "{{ nachricht }}"

haustuer_status:
  alias: Haustür Status
  description: Sagt den Nuki-Haustür-Status per TTS (Sprachsteuerung, nur lesen)
  icon: mdi:door-closed-lock
  mode: single
  sequence:
    - variables:
        nachricht: >-
          {%- set lock = states('lock.nuki_haustur_lock') -%}
          {%- set locked = is_state('binary_sensor.nuki_haustur_locked', 'on') -%}
          {%- if lock in ['unavailable', 'unknown', 'none', ''] -%}
          Ich kann den Status der Haustür gerade nicht ermitteln.
          {%- elif lock == 'locked' or locked -%}
          Die Haustür ist abgeschlossen.
          {%- elif lock == 'unlatched' -%}
          Die Haustür ist nicht verriegelt. Die Tür ist offen oder entriegelt.
          {%- elif lock == 'unlocked' -%}
          Die Haustür ist aufgeschlossen.
          {%- elif lock == 'locking' -%}
          Die Haustür wird gerade abgeschlossen.
          {%- elif lock == 'unlocking' -%}
          Die Haustür wird gerade aufgeschlossen.
          {%- else -%}
          Die Haustür hat den Status {{ lock }}.
          {%- endif -%}
    - action: tts.speak
      target:
        entity_id: media_player.benachrichtigung_lautsprecher
      data:
        cache: false
        media_player_entity_id: media_player.benachrichtigung_lautsprecher
        message: "{{ nachricht }}"

licht_aus_adrian:
  alias: Licht Adrian aus
  description: Kinderzimmer Adrian — Licht aus (Sprachsteuerung)
  icon: mdi:lightbulb-off-outline
