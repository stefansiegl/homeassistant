garten_bewaesserung_status:
  alias: Läuft Bewässerung
  description: Sagt an, welche Garten-Bewässerung gerade läuft (Sprachsteuerung)
  icon: mdi:information-outline
  mode: single
  sequence:
    - variables:
        nachricht: >-
          {%- set gross = is_state('valve.ventil_garten_rasen_gross', 'open')
              or is_state('script.garten_rasen_gross_bewaessern', 'on') -%}
          {%- set klein = is_state('valve.ventil_garten_rasen_klein', 'open')
              or is_state('script.garten_rasen_klein_bewaessern', 'on') -%}
          {%- set tropf = is_state('valve.ventil_garten_tropf_hecke_beet', 'open')
              or is_state('script.garten_tropf_bewaessern', 'on') -%}
          {%- if not gross and not klein and not tropf -%}
          Im Garten läuft gerade keine Bewässerung.
          {%- else -%}
          Im Garten läuft
          {%- if gross %} der große Rasensprenger{% endif -%}
          {%- if klein %}{% if gross %} und{% endif %} der Versenkregner{% endif -%}
          {%- if tropf %}{% if gross or klein %} und{% endif %} der Tropfschlauch{% endif -%}
          .
          {%- endif -%}
    - action: tts.speak
      target:
        entity_id: media_player.benachrichtigung_lautsprecher
      data:
        cache: false
        media_player_entity_id: media_player.benachrichtigung_lautsprecher
        message: "{{ nachricht }}"
