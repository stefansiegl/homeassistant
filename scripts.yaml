licht_eg_raum_ein:
  alias: Licht EG Raum Neutralwert
  description: Schaltet Raum mit tageszeitabhängigem Neutralwert ein (docs/licht-eg-anforderungen.md).
  mode: single
  fields:
    raum:
      description: kueche, ess oder wohn
      example: ess
      required: true
  sequence:
    - variables:
        abends: "{{ is_state('sun.sun', 'below_horizon') }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ raum == 'kueche' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.licht_eg_kueche
              data:
                brightness: "{{ 102 if abends else 204 }}"
                color_temp_kelvin: 2700
                transition: 1
        - conditions:
            - condition: template
              value_template: "{{ raum == 'ess' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.licht_eg_esszimmer_lang
              data:
                brightness: "{{ 128 if abends else 179 }}"
                color_temp_kelvin: 4000
                transition: 1
            - action: light.turn_on
              target:
                entity_id: light.licht_eg_esszimmer_schrank
            - action: light.turn_off
              target:
                entity_id:
                  - light.licht_eg_esszimmer_spot1
                  - light.licht_eg_esszimmer_spot2
                  - light.licht_eg_esszimmer_spot3
                  - light.licht_eg_esszimmer_spot4
        - conditions:
            - condition: template
              value_template: "{{ raum == 'wohn' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.licht_eg_wohnzimmer_zentral
              data:
                brightness: "{{ 115 if abends else 153 }}"
                color_temp_kelvin: 2700
                transition: 1
            - action: light.turn_on
              target:
                entity_id: light.licht_eg_wohnzimmer_iris
              data:
                brightness: "{{ 140 if abends else 179 }}"
                color_temp_kelvin: 2700
                transition: 1
            - action: light.turn_off
              target:
                entity_id:
                  - light.licht_eg_wohnzimmer_spot1
                  - light.licht_eg_wohnzimmer_spot2
                  - light.licht_eg_wohnzimmer_spot3
                  - light.licht_eg_wohnzimmer_regal
                  - light.licht_eg_wohnzimmer_tv_led
                  - light.licht_eg_wohnzimmer_couch_led

licht_eg_raum_toggle:
  alias: Licht EG Raum Toggle
  description: Raum aus oder Neutralwert; aktive Szene bleibt gespeichert.
  mode: single
  fields:
    raum:
      description: kueche, ess oder wohn
      example: ess
      required: true
    ziel_gruppe:
      description: light-Gruppe für Aus-Prüfung
      example: light.alle_lichter_esszimmer
      required: true
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ expand(ziel_gruppe) | selectattr('state', 'eq', 'on') | list | length > 0 }}
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ ziel_gruppe }}"
        - conditions: []
          sequence:
            - action: script.licht_eg_raum_ein
              data:
                raum: "{{ raum }}"

licht_eg_szene_aktivieren:
  alias: Licht EG Szene aktivieren
  description: Szene einschalten und aktive_szene_eg setzen.
  mode: queued
  max: 5
  fields:
    szene_name:
      description: Anzeigename für input_select.aktive_szene_eg
      example: Gemütlich
      required: true
    szene_entity:
      description: Entity-ID der Szene (Parameter szene_entity)
      example: scene.gemutlich
      required: true
    transition:
      description: Übergangszeit in Sekunden
      example: 2
      default: 2
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.aktive_szene_eg
      data:
        option: "{{ szene_name }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ transition | int(2) > 0 }}"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: "{{ szene_entity }}"
              data:
                transition: "{{ transition | int(2) }}"
        - conditions: []
          sequence:
            - action: scene.turn_on
              target:
                entity_id: "{{ szene_entity }}"

