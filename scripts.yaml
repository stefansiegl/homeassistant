  description: Aus = ganzes Wohnzimmer; An = nur Deckenlampen.
  mode: single
  fields:
    action_level:
      description: MQTT action_level als Helligkeit beim Einschalten
      example: 240
  sequence:
    - variables:
        wohn_decken:
          - light.licht_eg_wohnzimmer_zentral
          - light.licht_eg_wohnzimmer_spot1
          - light.licht_eg_wohnzimmer_spot2
          - light.licht_eg_wohnzimmer_spot3
        wohn_alle: light.alle_lichter_wohnzimmer
        ziel_helligkeit: >
          {% if action_level is none or action_level in ['null', 'None', ''] %}
            255
          {% else %}
            {{ action_level | int(1) }}
          {% endif %}
        ziel_kelvin: >
          {% set an = expand(wohn_decken) | selectattr('state', 'eq', 'on') | list %}
          {% if an %}
            {% set a = an[0].attributes %}
            {% if a.color_temp_kelvin is number %}{{ a.color_temp_kelvin | int }}
            {% elif a.color_temp is number %}{{ (1000000 / a.color_temp) | int }}
            {% else %}4000{% endif %}
          {% else %}4000{% endif %}
        irgendeins_an: >
          {{ expand(wohn_alle) | selectattr('state', 'eq', 'on') | list | length > 0 }}
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ irgendeins_an }}"
          sequence:
            - action: light.turn_off
              target:
                entity_id: "{{ wohn_alle }}"
        - conditions: []
