substitutions:
  name: "atom-bluetooth-proxy-3-2og"
packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/m5stack-atom-lite.yaml@main
esphome:
  name: ${name}
  name_add_mac_suffix: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  platform: esphome

# Active scanning — für Gardena BT-Pairing am 2.OG (Ventil testweise nah am Proxy).
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true