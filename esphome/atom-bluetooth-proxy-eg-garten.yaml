# Bluetooth-Proxy am EG-Fenster zum Garten (seit 06/2026).
# Physisches Gerät: ehem. M5 Atom „Keller“, physisch ans EG verlegt.
# ESPHome-Hostname (name) bleibt für stabiles OTA unverändert; Anzeigename über friendly_name.
substitutions:
  name: "atom-bluetooth-proxy-1-keller"
packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/m5stack-atom-lite.yaml@main
esphome:
  name: ${name}
  friendly_name: "Bluetooth Proxy EG Garten"
  name_add_mac_suffix: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  platform: esphome

# Active scanning — nötig für Gardena BT-Pairing und zuverlässige Verbindung.
# Nach erfolgreichem Ventil-Setup ggf. wieder auf passive stellen (weniger BT-Chatter).
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
