- id: ventilation_notaus
  alias: 'Lüftung: Not-Aus'
  description: Stoppt die Helios sofort und hält 0 % solange der Not-Aus aktiv ist.
  triggers:
  - trigger: state
    entity_id: input_boolean.ventilation_kill_switch
    to: 'on'
  - trigger: state
    entity_id: fan.helios
    attribute: percentage
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.ventilation_kill_switch
    state: 'on'
  actions:
  - target:
      entity_id: fan.helios
    data:
      percentage: 0
    action: fan.set_percentage
  mode: restart
- id: ventilation_auto_co2_control
  alias: 'Lüftung: Zentrale Steuerung'
  description: >-
    Setzt fan.helios auf sensor.luftung_status.ziel_prozent (Zeitprofile, CO₂,
    Nacht-Kühlung, Radon). Spec docs/climate.md.
  triggers:
  - trigger: state
    entity_id: sensor.luftung_status
  - trigger: state
    entity_id:
    - sensor.house_max_co2
    - sensor.db_04_e6_6d_44_0d_carbon_dioxide
    - sensor.aranet4_01_arbeitszimmer_carbon_dioxide
    - sensor.aranet4_02_kueche_carbon_dioxide
    - sensor.c9_46_fc_e8_90_d9_carbon_dioxide
    - sensor.db_04_e6_6d_44_0d_temperature
    - sensor.helios_outside_air_temperature
    - binary_sensor.helios_bypass
    - sensor.radon_meter_radon
    - input_boolean.radon_logic_enabled
    - input_number.radon_threshold_helper
    - input_number.radon_boost_threshold_helper
  - trigger: state
    entity_id: input_boolean.ventilation_kill_switch
    to: 'off'
  - trigger: time_pattern
    minutes: /5
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: input_boolean.ventilation_kill_switch
    state: 'off'
  actions:
  - variables:
      target_pct: "{{ state_attr('sensor.luftung_status', 'ziel_prozent') | int(0) }}"
  - target:
      entity_id: fan.helios
    data:
      percentage: "{{ target_pct }}"
    action: fan.set_percentage
  mode: restart
- id: climate_humidification_delta_v2_2
  alias: 'Klima: Intelligente Befeuchtung (Delta-Steuerung)'
  description: Regelt 3 Befeuchter. Nachtruhe 22-08 Uhr. Buzzer via Switch-Alarm deaktiviert.
  conditions:
  - condition: state
    entity_id: input_boolean.befeuchter_saison_aktiv
    state: 'on'
  triggers:
  - trigger: time_pattern
    minutes: /30
  - trigger: state
    entity_id: input_number.ziel_luftfeuchtigkeit
  - trigger: state
    entity_id: input_boolean.ventilation_kill_switch
  - trigger: state
    entity_id: fan.helios
  actions:
  - variables:
      ziel: '{{ states(''input_number.ziel_luftfeuchtigkeit'') | float(41) }}'
      hum_eg: '{{ states(''sensor.aranet4_02_kueche_humidity'') | float(100) }}'
      hum_1og: '{{ states(''sensor.c9_46_fc_e8_90_d9_humidity'') | float(100) }}'
      hum_2og: '{{ states(''sensor.aranet4_01_arbeitszimmer_humidity'') | float(100)
        }}'
      delta_eg: '{{ ziel - hum_eg }}'
      delta_1og: '{{ ziel - hum_1og }}'
      delta_2og: '{{ ziel - hum_2og }}'
  - if:
    - or:
      - condition: state
        entity_id: input_boolean.ventilation_kill_switch
        state: 'on'
      - condition: time
        after: '22:00:00'
        before: 08:00:00
      - condition: template
        value_template: "{{ state_attr('fan.helios', 'percentage') | int(0) > 10 }}"
    then:
    - action: humidifier.turn_off
      target:
        entity_id:
        - humidifier.deerma_jsq2w_a365_humidifier
        - humidifier.deerma_jsq2w_7134_humidifier
        - humidifier.deerma_jsq2w_b6e0_humidifier
    - stop: Nachtruhe, Kill-Switch oder Lüftung > 10 % aktiv
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ delta_eg > 0 }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.deerma_jsq2w_a365_alarm
      - action: humidifier.turn_on
        target:
          entity_id: humidifier.deerma_jsq2w_a365_humidifier
      - action: humidifier.set_mode
        target:
          entity_id: humidifier.deerma_jsq2w_a365_humidifier
        data:
          mode: '{% if delta_eg > 10 %} High {% elif delta_eg > 5 %} Medium {% else
            %} Low {% endif %}

            '
    default:
    - action: humidifier.turn_off
      target:
        entity_id: humidifier.deerma_jsq2w_a365_humidifier
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ delta_1og > 0 }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.deerma_jsq2w_7134_alarm
      - action: humidifier.turn_on
        target:
          entity_id: humidifier.deerma_jsq2w_7134_humidifier
      - action: humidifier.set_mode
        target:
          entity_id: humidifier.deerma_jsq2w_7134_humidifier
        data:
          mode: '{% if delta_1og > 10 %} High {% elif delta_1og > 5 %} Medium {% else
            %} Low {% endif %}

            '
    default:
    - action: humidifier.turn_off
      target:
        entity_id: humidifier.deerma_jsq2w_7134_humidifier
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ delta_2og > 0 }}'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.deerma_jsq2w_b6e0_alarm
      - action: humidifier.turn_on
        target:
          entity_id: humidifier.deerma_jsq2w_b6e0_humidifier
      - action: humidifier.set_mode
        target:
          entity_id: humidifier.deerma_jsq2w_b6e0_humidifier
        data:
          mode: '{% if delta_2og > 5 %} Medium {% else %} Low {% endif %}

            '
    default:
    - action: humidifier.turn_off
      target:
        entity_id: humidifier.deerma_jsq2w_b6e0_humidifier
  mode: restart
- id: humidifiers_water_shortage_notify
  alias: 'Klima: Warnung Wassertank leer'
  description: Sendet Push-Nachricht, wenn ein Befeuchter Wassermangel meldet.
  conditions:
  - condition: state
    entity_id: input_boolean.befeuchter_saison_aktiv
    state: 'on'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.deerma_jsq2w_a365_water_shortage_fault
    - binary_sensor.deerma_jsq2w_7134_water_shortage_fault
    - binary_sensor.deerma_jsq2w_b6e0_water_shortage_fault
    from: 'off'
    to: 'on'
    for:
      minutes: 3
  actions:
  - action: notify.mobile_app_pixel_9_pro
    data:
      title: "\U0001F4A7 Wassertank leer!"
      message: Der Befeuchter '{{ trigger.to_state.name }}' meldet Wassermangel. Bitte
        nachfüllen.
      data:
        clickAction: /lovelace/klima
  mode: parallel
- id: central_maintenance_system
  alias: Zentrales Wartungs-Management
  description: ''
  triggers:
  - trigger: time
    at: '10:00:00'
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.befeuchter_saison_aktiv
      state: 'on'
    - condition: template
      value_template: '{% set limit = states(''input_number.intervall_befeuchter_reinigung'')
        | int(60) %} {% set letzte = as_timestamp(states(''input_datetime.letzte_reinigung_befeuchter''))
        %} {{ (as_timestamp(now()) - letzte) / 86400 >= limit }}

        '
    then:
    - action: notify.mobile_app_pixel_9_pro
      data:
        title: "\U0001F9FC Wartung fällig"
        message: Bitte die Befeuchter reinigen.
        data:
          actions:
          - action: MARK_HUMIDIFIER_CLEANED
            title: Befeuchter erledigt ✅
  - if:
    - condition: template
      value_template: '{% set limit = states(''input_number.intervall_luefterfilter_reinigung'')
        | int(180) %} {% set letzte = as_timestamp(states(''input_datetime.letzte_wartung_luefterfilter''))
        %} {{ (as_timestamp(now()) - letzte) / 86400 >= limit }}

        '
    then:
    - action: notify.mobile_app_pixel_9_pro
      data:
        title: "\U0001F300 Wartung fällig"
        message: Bitte die Filter der Lüftungsanlage prüfen/reinigen.
        data:
          actions:
          - action: MARK_FAN_FILTER_CLEANED
            title: Filter erledigt ✅
- id: system_maintenance_reset_handler
  alias: 'System: Wartung Reset Handler'
  description: Setzt das jeweilige Wartungsdatum auf heute, wenn der Button in der
    Benachrichtigung gedrückt wird.
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''MARK_HUMIDIFIER_CLEANED''
          }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.letzte_reinigung_befeuchter
        data:
          date: '{{ now().strftime(''%Y-%m-%d'') }}'
      - action: notify.mobile_app_pixel_9_pro
        data:
          message: Check! Die Reinigung der Befeuchter wurde vermerkt.
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.action == ''MARK_FAN_FILTER_CLEANED''
          }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.letzte_wartung_luefterfilter
        data:
          date: '{{ now().strftime(''%Y-%m-%d'') }}'
      - action: notify.mobile_app_pixel_9_pro
        data:
          message: Check! Der Filterwechsel wurde im System gespeichert.
- id: nuki_haustuer_battery_warnung
  alias: 'Nuki: Haustür Batterie warnen'
  description: Push wenn Nuki-Schloss oder Keypad Batterie niedrig oder kritisch ist.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.nuki_haustur_battery
    below: input_number.batterie_warnschwelle
  - trigger: state
    entity_id: binary_sensor.nuki_haustur_battery_critical
    from: 'off'
    to: 'on'
    for: 01:00:00
  - trigger: state
    entity_id: binary_sensor.nuki_haustur_keypad_battery_critical
    from: 'off'
    to: 'on'
    for: 01:00:00
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trigger.entity_id == 'binary_sensor.nuki_haustur_keypad_battery_critical' }}"
      sequence:
      - action: notify.mobile_app_pixel_9_pro
        data:
          title: Nuki Keypad Batterie kritisch
          message: Das Nuki-Keypad an der Haustür meldet kritischen Batteriestand. Bitte zeitnah wechseln.
    - conditions:
      - condition: template
        value_template: "{{ trigger.entity_id == 'binary_sensor.nuki_haustur_battery_critical' }}"
      sequence:
      - action: notify.mobile_app_pixel_9_pro
        data:
          title: Nuki Haustür Batterie kritisch
          message: Das Nuki-Schloss meldet kritischen Batteriestand. Bitte sofort wechseln — sonst kein Zugang.
    default:
    - action: notify.mobile_app_pixel_9_pro
      data:
        title: Nuki Haustür Batterie niedrig
        message: "Nuki-Schloss nur noch {{ states('sensor.nuki_haustur_battery') }} %. Bitte Batterien besorgen."
  mode: single
- id: haus_warnungen_benachrichtigen
  alias: 'System: Haus-Warnungen benachrichtigen'
  description: Push wenn mindestens ein Haus-Warnung-Check aktiv ist (mit Text in liste).
  triggers:
  - trigger: state
    entity_id: binary_sensor.haus_hat_warnungen
    from: 'off'
    to: 'on'
    for: '00:05:00'
  conditions:
  - condition: template
    value_template: "{{ state_attr('sensor.haus_warnungen', 'liste') | trim | length > 0 }}"
  actions:
  - action: notify.haus_warnungen
    data:
      title: Haus-Warnung
      message: "{{ state_attr('sensor.haus_warnungen', 'liste') }}"
  mode: single
- id: '1770730843209'
  alias: 'Haushalt: Spülmaschine Status-Management'
  description: 'Phase B = Herd + Spülmaschine. Start nur bei dauerhaft >200W; Abbruch bei langem Standby (~20W) ohne Gang.'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.spuelmaschine_shellypro3em_leistung
    above: 200
    for: 00:05:00
    id: trigger_start
  - trigger: numeric_state
    entity_id: sensor.spuelmaschine_shellypro3em_leistung
    below: 45
    for: 00:12:00
    id: trigger_abort
  - trigger: numeric_state
    entity_id: sensor.spuelmaschine_shellypro3em_leistung
    below: 6
    for: 00:05:00
    id: trigger_fertig
  - trigger: numeric_state
    entity_id: sensor.spuelmaschine_shellypro3em_leistung
    below: 1
    for: 00:15:00
    id: trigger_standby
  - trigger: homeassistant
    event: start
    id: system_start
  actions:
  - if:
    - condition: trigger
      id: system_start
    then:
    - delay: 00:01:00
    - if:
      - condition: template
        value_template: '{{ states(''sensor.spuelmaschine_shellypro3em_leistung'') | float(0) <
          1.0 }}'
      then:
      - action: input_select.select_option
        target:
