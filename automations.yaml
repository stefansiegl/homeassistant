    data:
      title: "Spülmaschine fertig! \U0001F37D️"
      message: Geschirr sauber.
      data:
        push:
          sound: default
          interruption-level: active
  - if:
    - condition: or
      conditions:
      - condition: and
        conditions:
        - condition: time
          after: 08:00:00
          before: '20:30:00'
        - condition: time
          weekday:
          - mon
          - tue
          - wed
          - thu
          - fri
      - condition: and
        conditions:
        - condition: time
          after: 09:30:00
          before: '20:30:00'
        - condition: time
          weekday:
          - sat
          - sun
    then:
    - action: media_player.volume_set
      target:
        entity_id: media_player.benachrichtung_lautsprecher
      data:
        volume_level: 0.4
    - action: tts.google_translate_say
      target:
        entity_id: media_player.benachrichtung_lautsprecher
