- id: '1773005445626'
  alias: 'Assist: Sprachausgabe umleiten'
  description: Fängt das TTS-Audio vom ReSpeaker ab und spielt es auf einem echten
    Lautsprecher ab.
  triggers:
  - event_type: esphome.tts_uri
    trigger: event
  conditions: []
  actions:
  - target:
      device_id: 91100559296529f61f7936899693dca3
    data:
      media:
        media_content_id: '{{ trigger.event.data.uri }}'
        media_content_type: music
        metadata: {}
    action: media_player.play_media
  mode: single
- id: energie_statistik_monitoring
  alias: 'Energie: Statistik-Anomalie-Check'
  description: Prüft Verbrauchs-statistik auf Sprünge; benachrichtigt ohne Auto-Reparatur.
  triggers:
  - trigger: time
    at: 08:00:00
  - trigger: time
    at: '20:00:00'
  actions:
  - action: shell_command.check_energie_statistik_anomaly
  - action: homeassistant.update_entity
    target:
      entity_id:
      - sensor.energie_statistik_anomalie_anzahl
      - sensor.energie_statistik_anomalie_text
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.energie_statistik_anomalie_anzahl
        above: 0
      sequence:
      - action: notify.haus_warnungen
        data:
          title: Energie-Statistik
          message: >-
            {{ states('sensor.energie_statistik_anomalie_text')
            | default('Auffällige Verbrauchssprünge — check-energie-statistik.sh', true) }}
  mode: single
- id: garten_tropf_automatisch
  alias: 'Garten: Tropf automatisch'
  description: Bewässert Hecke/Beet bei Trockenheit (docs/garten-bewaesserung.md)
  triggers:
  - trigger: time_pattern
    hours: '/2'
    minutes: '0'
  - trigger: state
    entity_id:
    - sensor.feuchte_garten_hecke_soil_moisture
    - sensor.feuchte_garten_beet_soil_moisture
  conditions:
  - condition: state
    entity_id: input_boolean.garten_tropf_automatisch
    state: 'on'
  - condition: template
    value_template: >
      {% set sh = states('input_number.garten_schwellwert_hecke') | float(35) %}
      {% set sb = states('input_number.garten_schwellwert_beet') | float(35) %}
      {% set h = states('sensor.feuchte_garten_hecke_soil_moisture') %}
      {% set b = states('sensor.feuchte_garten_beet_soil_moisture') %}
      {{ (h not in ['unknown', 'unavailable', 'none', ''] and h | float(100) < sh)
         or (b not in ['unknown', 'unavailable', 'none', ''] and b | float(100) < sb) }}
  - condition: template
    value_template: >
      {% set last = states('input_datetime.garten_tropf_letzte_bewaesserung') %}
      {% if last in ['unknown', 'unavailable', 'none', ''] %}
        true
      {% else %}
        {{ (as_timestamp(now()) - as_timestamp(last)) > (states('input_number.garten_tropf_sperre_stunden') | float(6) * 3600) }}
      {% endif %}
  - condition: time
    after: 06:00:00
    before: '21:00:00'
  actions:
  - action: script.garten_tropf_bewaessern
  mode: single
