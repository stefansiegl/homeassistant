- id: energie_statistik_monitoring
  alias: 'Energie: Statistik-Anomalie-Check'
  description: Prüft Verbrauchs-statistik auf Sprünge; benachrichtigt ohne Auto-Reparatur.
  triggers:
  - trigger: time
    at: 08:00:00
  - trigger: time
    at: '20:00:00'
  actions:
  - action: shell_command.check_energie_statistik_anomaly
  - action: homeassistant.update_entity
    target:
      entity_id:
      - sensor.energie_statistik_anomalie_anzahl
      - sensor.energie_statistik_anomalie_text
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.energie_statistik_anomalie_anzahl
        above: 0
      sequence:
      - action: notify.haus_warnungen
        data:
          title: Energie-Statistik
          message: >-
            {{ states('sensor.energie_statistik_anomalie_text')
            | default('Auffällige Verbrauchssprünge — check-energie-statistik.sh', true) }}
  mode: single
- id: garten_tropf_automatisch
  alias: 'Garten: Tropf automatisch'
  description: Abend 21:00 + tagsüber Feuchte 08–20 Uhr, mit Limits (docs/garten-bewaesserung.md)
  triggers:
  - trigger: time
    at: '21:00:00'
    id: abend
  - trigger: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_5
    below: input_number.garten_schwellwert_beet
    for: 00:15:00
    id: beet_trocken
  - trigger: numeric_state
    entity_id: sensor.gw1100a_soil_moisture_6
    below: input_number.garten_schwellwert_hecke
    for: 00:15:00
    id: hecke_trocken
  conditions:
  - condition: state
    entity_id: input_boolean.garten_tropf_automatisch
    state: 'on'
  - condition: template
    value_template: >
      {% if trigger.id == 'abend' %}
        true
      {% else %}
        {{ now().hour >= 8 and now().hour < 20 }}
      {% endif %}
  - condition: template
    value_template: >
      {% set beet = states('sensor.gw1100a_soil_moisture_5') %}
      {% set hecke = states('sensor.gw1100a_soil_moisture_6') %}
      {% set zb = states('input_number.garten_schwellwert_beet') | float(35) %}
      {% set zh = states('input_number.garten_schwellwert_hecke') | float(35) %}
      {% set beet_trocken = beet not in ['unknown', 'unavailable', 'none', ''] and beet | float(100) < zb %}
      {% set hecke_trocken = hecke not in ['unknown', 'unavailable', 'none', ''] and hecke | float(100) < zh %}
      {{ beet_trocken or hecke_trocken }}
  - condition: template
    value_template: >
      {{ not is_state('script.garten_tropf_bewaessern', 'on')
         and not is_state('script.garten_morgen_bewaessern', 'on')
         and not is_state('valve.ventil_garten_tropf_hecke_beet', 'open')
         and not is_state('valve.ventil_garten_rasen_gross', 'open')
         and not is_state('valve.ventil_garten_rasen_klein', 'open') }}
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: >
          {{ states('counter.garten_tropf_laeufe_heute') | int(0)
             >= states('input_number.garten_tropf_max_laeufe_tag') | int(3) }}
      sequence:
      - action: script.garten_tropf_limit_alarm
    default:
    - if:
      - condition: trigger
        id: abend
      then:
      - action: script.garten_tropf_bewaessern
      else:
      - action: script.garten_tropf_bewaessern
        data:
          dauer_minuten: "{{ states('input_number.garten_tropf_dauer_tag_minuten') | int(30) }}"
  mode: single
- id: garten_tropf_zaehler_reset
  alias: 'Garten: Tropf Zähler Mitternacht'
  description: Setzt counter.garten_tropf_laeufe_heute auf 0
  triggers:
  - trigger: time
    at: '00:05:00'
  actions:
  - action: counter.reset
    target:
      entity_id: counter.garten_tropf_laeufe_heute
  mode: single
- id: garten_rasen_morgens
  alias: 'Garten: Bewässerung morgens'
  description: Täglich 4 Uhr feuchtebasiert A/B/Tropf (docs/garten-bewaesserung.md)
  triggers:
  - trigger: time
    at: '04:00:00'
  conditions:
  - condition: state
    entity_id: input_boolean.garten_rasen_automatisch
    state: 'on'
  - condition: template
    value_template: >
      {{ not is_state('script.garten_rasen_gross_bewaessern', 'on')
         and not is_state('script.garten_rasen_klein_bewaessern', 'on')
         and not is_state('script.garten_tropf_bewaessern', 'on')
         and not is_state('script.garten_morgen_bewaessern', 'on')
         and not is_state('valve.ventil_garten_rasen_gross', 'open')
         and not is_state('valve.ventil_garten_rasen_klein', 'open')
         and not is_state('valve.ventil_garten_tropf_hecke_beet', 'open') }}
  actions:
  - action: script.garten_morgen_bewaessern
  mode: single
- id: garten_sicherheit_max_laufzeit
  alias: 'Garten: Sicherheit Max-Laufzeit'
  description: Schließt Außen-Ventile nach konfigurierbarer Max-Laufzeit (docs/garten-bewaesserung.md)
  triggers:
  - trigger: time_pattern
    minutes: '/5'
  - trigger: state
    entity_id:
    - valve.ventil_garten_rasen_gross
    - valve.ventil_garten_rasen_klein
    - valve.ventil_garten_tropf_hecke_beet
    to: open
  conditions: []
  actions:
  - repeat:
      for_each:
      - valve.ventil_garten_rasen_gross
      - valve.ventil_garten_rasen_klein
      - valve.ventil_garten_tropf_hecke_beet
      sequence:
      - if:
        - condition: template
          value_template: >
            {% set v = repeat.item %}
            {% set max_s = states('input_number.garten_max_laufzeit_stunden') | float(1) * 3600 %}
            {{ is_state(v, 'open')
               and (as_timestamp(now()) - as_timestamp(states[v].last_changed)) > max_s }}
        then:
        - action: valve.close_valve
          target:
            entity_id: '{{ repeat.item }}'
        - action: persistent_notification.create
          data:
            title: Garten Sicherheit
            message: >
              {{ state_attr(repeat.item, 'friendly_name') or repeat.item }}
              wurde nach {{ states('input_number.garten_max_laufzeit_stunden') }} h automatisch geschlossen.
        - if:
          - condition: template
            value_template: "{{ repeat.item == 'valve.ventil_garten_tropf_hecke_beet' }}"
          then:
          - action: notify.mobile_app_pixel_9_pro
            data:
              title: Tropf — Max-Laufzeit
              message: >-
                Tropfventil länger als {{ states('input_number.garten_max_laufzeit_stunden') }} h offen —
                zwangsweise geschlossen. Bitte prüfen.
  mode: single

