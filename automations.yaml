          szene_name: Hell
          szene_entity: scene.hell
          transition: 0
    - conditions:
      - condition: trigger
        id: scene_3
      sequence:
      - action: script.licht_eg_szene_aktivieren
        data:
          szene_name: Brettspiele
          szene_entity: scene.brettspiele
          transition: 5
    - conditions:
      - condition: trigger
        id: scene_4
      sequence:
      - action: script.licht_eg_szene_aktivieren
        data:
          szene_name: Kathi Gemütlich
          szene_entity: scene.kathi_gemutlich
          transition: 2
    - conditions:
      - condition: trigger
        id: off_all
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.aktive_szene_eg
        data:
          option: —
      - action: light.turn_off
        target:
          entity_id: light.alle_lichter_erdgeschoss
    - conditions:
      - condition: trigger
        id: dim_up
      sequence:
      - repeat:
          count: 20
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
                  ''eq'', ''on'') | list | length > 0 }} '
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
                    ''eq'', ''on'') | map(attribute=''entity_id'') | list }} '
                data:
                  brightness_step_pct: 10
          - delay: '00:00:00.500'
    - conditions:
      - condition: trigger
        id: dim_down
      sequence:
      - repeat:
          count: 20
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
                  ''eq'', ''on'') | selectattr(''attributes.brightness'', ''defined'')
                  | selectattr(''attributes.brightness'', ''gt'', 25) | list | length
                  > 0 }} '
              sequence:
              - action: light.turn_on
                target:
                  entity_id: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
                    ''eq'', ''on'') | selectattr(''attributes.brightness'', ''defined'')
                    | selectattr(''attributes.brightness'', ''gt'', 25) | map(attribute=''entity_id'')
                    | list }} '
                data:
                  brightness_step_pct: -10
          - delay: '00:00:00.500'
    - conditions:
      - condition: trigger
        id: dim_stop
      sequence:
      - stop: Dimm-Vorgang durch Loslassen der Taste abgebrochen.
  mode: restart
- id: licht_drehregler_esszimmer
  alias: 'Licht: Drehregler Esszimmer'
  description: Absolutes Dimmen und HA-basierter Klick-Toggle (docs/licht-drehregler-eg.md)
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/Schalter-EG-Licht-Drehregler-Esszimmer
  conditions:
  - condition: template
    value_template: "{{ trigger.payload_json.action is defined }}"
  actions:
  - variables:
      mqtt_action: "{{ trigger.payload_json.action }}"
      mqtt_level: "{{ trigger.payload_json.action_level | default(none) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ mqtt_action == 'brightness_move_to_level' }}"
      sequence:
      - action: script.licht_ess_drehregler_helligkeit
        data:
          action_level: "{{ mqtt_level }}"
    - conditions:
      - condition: template
        value_template: "{{ mqtt_action in ['on', 'off'] }}"
      sequence:
      - action: script.licht_ess_drehregler_klick
        data:
          action_level: "{{ mqtt_level }}"
  mode: queued
  max: 10
