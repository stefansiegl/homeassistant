    type: action
    subtype: up_hold_release
    id: stop_dimming
    trigger: device
  - domain: mqtt
    device_id: 0457441d0c73d8db61464dce69f22ef2
    type: action
    subtype: down_hold_release
    id: stop_dimming
    trigger: device
  - domain: mqtt
    device_id: 0457441d0c73d8db61464dce69f22ef2
    type: action
    subtype: off_press
    id: hue_button
    trigger: device
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: power_hold
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.aktive_szene_eg
        data:
          option: —
      - target:
          entity_id: light.alle_lichter_erdgeschoss
        data:
          transition: 3
        action: light.turn_off
    - conditions:
      - condition: trigger
        id: hue_button
      sequence:
      - target:
          entity_id: input_select.szenen_zyklus_eg
        data:
          cycle: true
        action: input_select.select_next
      - delay:
          milliseconds: 250
      - variables:
          szene: "{{ states('input_select.szenen_zyklus_eg') }}"
          szene_entity: >
            {% if szene == 'Hell' %} scene.hell
            {% elif szene == 'Gemütlich' %} scene.gemutlich
            {% elif szene == 'Kino' %} scene.kino
            {% elif szene == 'Sonnenuntergang' %} scene.sonnenuntergang
            {% elif szene == 'Kathi Gemütlich' %} scene.kathi_gemutlich
            {% elif szene == 'Brettspiele' %} scene.brettspiele
            {% else %} scene.gemutlich {% endif %}
          szene_transition: >
            {% if szene == 'Hell' %} 0
            {% elif szene == 'Brettspiele' %} 5
            {% else %} 2 {% endif %}
      - action: script.licht_eg_szene_aktivieren
        data:
          szene_name: "{{ szene }}"
          szene_entity: "{{ szene_entity }}"
          transition: "{{ szene_transition }}"
    - conditions:
      - condition: trigger
        id: dim_up
      sequence:
      - target:
          entity_id: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
            ''eq'', ''on'') | map(attribute=''entity_id'') | list }} '
        data:
          brightness_step_pct: 15
          transition: 0.3
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: dim_up_hold
      sequence:
      - repeat:
          count: 20
          sequence:
          - target:
              entity_id: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
                ''eq'', ''on'') | map(attribute=''entity_id'') | list }} '
            data:
              brightness_step_pct: 15
              transition: 0.3
            action: light.turn_on
          - delay:
              milliseconds: 300
    - conditions:
      - condition: trigger
        id: dim_down
      sequence:
      - target:
          entity_id: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
            ''eq'', ''on'') | selectattr(''attributes.brightness'', ''defined'') |
            selectattr(''attributes.brightness'', ''>'', 38) | map(attribute=''entity_id'')
            | list }} '
        data:
          brightness_step_pct: -15
          transition: 0.3
        action: light.turn_on
    - conditions:
      - condition: trigger
        id: dim_down_hold
      sequence:
      - repeat:
          count: 20
          sequence:
          - target:
              entity_id: '{{ expand(''light.alle_lichter_erdgeschoss'') | selectattr(''state'',
                ''eq'', ''on'') | selectattr(''attributes.brightness'', ''defined'')
                | selectattr(''attributes.brightness'', ''>'', 38) | map(attribute=''entity_id'')
                | list }} '
            data:
              brightness_step_pct: -15
              transition: 0.3
            action: light.turn_on
          - delay:
              milliseconds: 300
    - conditions:
      - condition: trigger
        id: stop_dimming
      sequence:
      - delay:
          milliseconds: 10
  mode: restart
