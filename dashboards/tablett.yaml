# Dashboard: Tablett (EG)
# Siehe docs/dashboard-tablett.md

views:
- type: panel
  sections: []
  cards:
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
        - condition: state
          entity: binary_sensor.haus_hat_warnungen
          state: 'on'
      card:
        type: custom:mushroom-template-card
        primary: Achtung
        secondary: "{{ state_attr('sensor.haus_warnungen', 'liste') }}"
        multiline_secondary: true
        icon: mdi:alert-circle
        icon_color: red
        layout: vertical
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        entity: scene.hell
        name: Helles Licht
        show_icon: false
        styles:
          card:
          - margin: 6px
          - height: 180px
          - background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)),  url("/local/images/dashboards/szene_hell_tech.jpg")
          - background-size: cover
          - background-position: center
          - border-radius: 36px
          - border: 1px solid rgba(255, 255, 255, 0.2)
          - box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5)
          name:
          - font-family: MichromaLocal
          - font-size: 28px
          - font-weight: 700
          - color: white
          - text-shadow: 0px 0px 20px rgba(255,255,255,0.4), 2px 4px 10px rgba(0,0,0,0.9)
          - justify-self: center
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data:
            entity_id: scene.hell
      - type: custom:button-card
        entity: scene.gemutlich
        name: Gemütlich
        show_icon: false
        styles:
          card:
          - margin: 6px
          - height: 180px
          - background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)),  url("/local/images/dashboards/szene_gemuetlich_tech.jpg")
          - background-size: cover
          - background-position: center
          - border-radius: 36px
          - border: 1px solid rgba(255, 255, 255, 0.2)
          - box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5)
          name:
          - font-family: MichromaLocal
          - font-size: 28px
          - font-weight: 700
          - color: white
          - text-shadow: 0px 0px 20px rgba(255,255,255,0.4), 2px 4px 10px rgba(0,0,0,0.9)
          - justify-self: center
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data:
            entity_id: scene.gemutlich
      - type: custom:button-card
        entity: scene.kino
        name: Kino
        show_icon: false
        styles:
          card:
          - margin: 6px
          - height: 180px
          - background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)),  url("/local/images/dashboards/szene_kino.jpg")
          - background-size: cover
          - background-position: center
          - border-radius: 36px
          - border: 1px solid rgba(255, 255, 255, 0.2)
          - box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5)
          name:
          - font-family: MichromaLocal
          - font-size: 28px
          - font-weight: 700
          - color: white
          - text-shadow: 0px 0px 20px rgba(255,255,255,0.4), 2px 4px 10px rgba(0,0,0,0.9)
          - justify-self: center
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data:
            entity_id: scene.kino
      - type: custom:button-card
        entity: scene.sonnenuntergang
        name: Sonnenuntergang
        show_icon: false
        styles:
          card:
          - margin: 6px
          - height: 180px
          - background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.6)),  url("/local/images/dashboards/szene_sonnenuntergang.jpg")
          - background-size: cover
          - background-position: center
          - border-radius: 36px
          - border: 1px solid rgba(255, 255, 255, 0.2)
          - box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5)
          name:
          - font-family: MichromaLocal
          - font-size: 28px
          - font-weight: 700
          - color: white
          - text-shadow: 0px 0px 20px rgba(255,255,255,0.4), 2px 4px 10px rgba(0,0,0,0.9)
          - justify-self: center
        tap_action:
          action: call-service
          service: scene.turn_on
          service_data:
            entity_id: scene.sonnenuntergang
    - type: custom:button-card
      show_icon: false
      name: "[[[\n  var rest = states['sensor.waste_rest_days'] ? parseInt(states['sensor.waste_rest_days'].attributes.daysTo) : 99;\n  var gelb = states['sensor.waste_gelb_days'] ? parseInt(states['sensor.waste_gelb_days'].attributes.daysTo) : 99;\n  var bio = states['sensor.waste_bio_days'] ? parseInt(states['sensor.waste_bio_days'].attributes.daysTo) : 99;\n  var papier = states['sensor.waste_papier_days'] ? parseInt(states['sensor.waste_papier_days'].attributes.daysTo) : 99;\n  \n  var min = Math.min(rest, gelb, bio, papier);\n  if (min > 10) return ''; // Text leer, wenn keine Abholung ansteht\n  \n  // Finde heraus, welche Tonne(n) es betrifft\n  var active_bins = [];\n  if (rest === min) active_bins.push(\"RESTMÜLL\");\n  if (gelb === min) active_bins.push(\"GELBE TONNE\");\n  if (bio === min) active_bins.push(\"BIOMÜLL\");\n  if (papier === min) active_bins.push(\"ALTPAPIER\");\n  \n  var day_str = min === 0 ? 'HEUTE' : 'MORGEN';\n  return 'MÜLL ' + day_str + ': ' + active_bins.join('\
        \ & ');\n]]]\n"
      styles:
        card:
        - display: "[[[\n  var rest = states['sensor.waste_rest_days'] ? parseInt(states['sensor.waste_rest_days'].attributes.daysTo) : 99;\n  var gelb = states['sensor.waste_gelb_days'] ? parseInt(states['sensor.waste_gelb_days'].attributes.daysTo) : 99;\n  var bio = states['sensor.waste_bio_days'] ? parseInt(states['sensor.waste_bio_days'].attributes.daysTo) : 99;\n  var papier = states['sensor.waste_papier_days'] ? parseInt(states['sensor.waste_papier_days'].attributes.daysTo) : 99;\n  \n  var min = Math.min(rest, gelb, bio, papier);\n  return min <= 10 ? 'flex' : 'none'; // Zeigt Balken nur an, wenn min 0 oder 1 ist\n]]]\n"
        - margin: 6px
        - height: 100px
        - background: linear-gradient(rgba(255, 150, 0, 0.15), rgba(0, 0, 0, 0.8))
        - border-radius: 28px
        - border: 1px solid rgba(255, 150, 0, 0.5)
        - box-shadow: 0 0 20px rgba(255, 150, 0, 0.3)
        name:
        - font-family: MichromaLocal
        - font-size: 22px
        - font-weight: 700
        - color: white
        - text-transform: uppercase
        - text-shadow: 0px 0px 15px rgba(255, 150, 0, 0.8)
        - justify-self: center
  background:
    opacity: 100
    alignment: center
    size: cover
    repeat: repeat
    attachment: fixed
