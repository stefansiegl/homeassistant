  # Stromzähler MT691: Tasmota-Ausreißer filtern (siehe docs/energie-statistik-praevention.md)
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - sensor.tasmota_mt691_total_in
          - sensor.tasmota_mt691_total_out
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "MT691 Total In Stabil"
        unique_id: mt691_total_in_stabil
        icon: mdi:transmission-tower
        device_class: energy
        state_class: total_increasing
        unit_of_measurement: kWh
        availability: >
          {{ states('sensor.tasmota_mt691_total_in') not in ['unknown', 'unavailable', 'none']
             or this.state not in ['unknown', 'unavailable', 'none', ''] }}
        state: >
          {% set source = 'sensor.tasmota_mt691_total_in' %}
          {% set raw = states(source) | float(none)
             if trigger.platform != 'state'
             else (trigger.to_state.state | float(none) if trigger.entity_id == source else states(source) | float(none)) %}
          {% if raw is none %}
            {{ this.state }}
          {% else %}
            {% set last = this.state | float(none) %}
            {% set last_ts = this.attributes.get('last_accepted_ts', as_timestamp(this.last_updated)) | float(0) %}
            {% set now_ts = as_timestamp(trigger.to_state.last_updated)
               if trigger.platform == 'state' and trigger.entity_id == source else as_timestamp(now()) %}
            {% if last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}
              {{ raw }}
            {% else %}
              {% set hours = (now_ts - last_ts) / 3600 %}
              {% set limit = 500.0 if hours > 48 else [35.0 * hours, 0.1] | max %}
              {% set accepted = raw %}
              {% if last > 5000 and raw < 5000 %}
                {% set accepted = last %}
              {% elif raw - last > limit %}
                {% if hours > 48 and raw >= last %}{% set accepted = raw %}{% else %}{% set accepted = last %}{% endif %}
              {% elif last - raw > 2.0 %}
                {% set accepted = last %}
              {% elif raw > last * 1.05 and raw - last > 50 %}
                {% set accepted = last %}
              {% endif %}
              {{ accepted }}
            {% endif %}
          {% endif %}
