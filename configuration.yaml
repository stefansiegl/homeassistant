# ---------------------------------------------------------
# CORE CONFIGURATION
# ---------------------------------------------------------

default_config:

# Themes für das Mushroom/Google Sans Design
frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  customize:
    # Gaszähler Einstellungen
    sensor.gasmeter_value:
      device_class: gas
      state_class: total_increasing

    sensor.gasmeter_value_stabil:
      device_class: gas
      state_class: total_increasing

    sensor.gasmeter_stabil_kosten:
      device_class: monetary
      state_class: total

    sensor.watermeter_stabil_kosten:
      device_class: monetary
      state_class: total

    sensor.strom_bezug_stabil_kosten:
      device_class: monetary
      state_class: total

    sensor.strom_einspeisung_stabil_vergutung:
      device_class: monetary
      state_class: total

    sensor.watermeter_value_stabil:
      device_class: water
      state_class: total_increasing

    # Stromzähler (Tasmota MT691)
    sensor.tasmota_mt691_power_cur:
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"
    sensor.tasmota_mt691_total_in:
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
    sensor.tasmota_mt691_total_out:
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    sensor.mt691_total_in_stabil:
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
    sensor.mt691_total_out_stabil:
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing

    sensor.mt691_power_cur_stabil:
      device_class: power
      state_class: measurement
      unit_of_measurement: "W"

    # Garten-Bewässerung (docs/garten-bewaesserung.md)
    valve.ventil_garten_rasen_klein:
      friendly_name: Versenkregner
      entity_picture: /local/images/garden/regner-sd80.webp
    valve.ventil_garten_rasen_gross:
      friendly_name: großer Rasensprenger
    valve.ventil_garten_tropf_hecke_beet:
      friendly_name: Tropfschlauch

    # Sprachsteuerung (Google/Assist) — siehe docs/sprachsteuerung-licht-eg.md
    light.alle_lichter_erdgeschoss:
      friendly_name: Alle Lichter Erdgeschoss
    light.alle_lichter_wohnzimmer:
      friendly_name: Alle Lichter Wohnzimmer
    light.alle_lichter_esszimmer:
      friendly_name: Alle Lichter Esszimmer
    light.licht_eg_kueche:
      friendly_name: Licht Küche

    light.licht_1og_adrian:
      friendly_name: Licht Adrian
    light.licht_1og_david:
      friendly_name: Licht David

    sensor.helios_luftung_energy:
      friendly_name: Helios Lüftung
    sensor.vicare_energy_consumption_today:
      friendly_name: Vitovalor Strom heute (ViCare)
    sensor.vicare_energy_consumption_this_month:
      friendly_name: Vitovalor Strom

  packages:
    helpers: !include helpers.yaml
    luftung: !include luftung_templates.yaml

# ---------------------------------------------------------
# RECORDER (MariaDB Short-term Storage)
# ---------------------------------------------------------

recorder:
  db_url: !secret maria_db_recorder_db_url
  auto_purge: true
  purge_keep_days: 31
  exclude:
    entities:
      - sensor.gasmeter_uptime
      - sensor.gasmeter_mac
      - sensor.gasmeter_fwversion
      - sensor.gasmeter_hostname
      - sensor.gasmeter_freemem
      - sensor.gasmeter_wifirssi
      - sensor.gasmeter_cputemp
      - sensor.gasmeter_interval
      - sensor.gasmeter_ip
      - sensor.gasmeter_status
      - sensor.gasmeter_raw
      - sensor.gasmeter_error
      - sensor.gasmeter_rate_per_time_unit
      - sensor.gasmeter_rate_per_digitalization_round
      - sensor.gasmeter_timestamp
      - sensor.gasmeter_json
      - sensor.gasmeter_value
      - sensor.gasmeter_value_cost
      - sensor.gasmeter_value_stabil_cost
      - sensor.gasmeter_value_stabil_cost_2
      - sensor.watermeter_value_cost
      - sensor.watermeter_value_stabil_cost
      - sensor.tasmota_mt691_total_in
      - sensor.tasmota_mt691_total_out
      - sensor.tasmota_mt691_power_cur
      - sensor.tasmota_mt691_total_in_cost
      - sensor.tasmota_mt691_total_out_compensation
      - sensor.mt691_total_in_stabil_cost
      - sensor.mt691_total_out_stabil_compensation
      - sensor.watermeter_uptime
      - sensor.watermeter_mac
      - sensor.watermeter_fwversion
      - sensor.watermeter_hostname
      - sensor.watermeter_freemem
      - sensor.watermeter_wifirssi
      - sensor.watermeter_cputemp
      - sensor.watermeter_interval
      - sensor.watermeter_ip
      - sensor.watermeter_status
      - sensor.watermeter_raw
      - sensor.watermeter_error
      - sensor.watermeter_rate_per_time_unit
      - sensor.watermeter_rate_per_digitalization_round
      - sensor.watermeter_timestamp
      - sensor.watermeter_json
      - sensor.watermeter_value

# ---------------------------------------------------------
# LOGBOOK (Verlaufseinträge filtern)
# ---------------------------------------------------------

logbook:
  exclude:
    entities:
      - sensor.gasmeter_uptime
      - sensor.gasmeter_status
      - sensor.watermeter_uptime
      - sensor.watermeter_status

# ---------------------------------------------------------
# INFLUXDB (Long-term Storage)
# ---------------------------------------------------------

influxdb:
  host: 127.0.0.1
  port: 8086
  database: homeassistant
  username: homeassistant
  password: !secret influxdb_pass
  max_retries: 3
  default_measurement: state
  include:
    entity_globs:
      - sensor.temperatursensor_*
      - sensor.plantsensor_*
      - sensor.shellyplug*[energy|power|uptime]
      - sensor.steckdose_keller_*[energy|power]
      - sensor.vicare_*
      - sensor.tasmota_mt691*

# ---------------------------------------------------------
# MODERN TEMPLATES (Sensoren & Mülllogik)
# ---------------------------------------------------------

template:
  # Wasserzähler: OCR-Ausreißer filtern (siehe docs/ai-on-the-edge.md)
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.watermeter_value
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "Watermeter Value Stabil"
        unique_id: watermeter_value_stabil
        icon: mdi:water-pump
        device_class: water
        state_class: total_increasing
        unit_of_measurement: m³
        availability: >
          {{ states('sensor.watermeter_value') not in ['unknown', 'unavailable', 'none']
             or this.state not in ['unknown', 'unavailable', 'none', ''] }}
        state: >
          {% set korrektur = states('input_number.watermeter_stabil_korrektur') | float(0) %}
          {% if korrektur > 0 %}
            {{ korrektur }}
          {% else %}
            {% set raw = states('sensor.watermeter_value') | float(none)
               if trigger.platform != 'state'
               else trigger.to_state.state | float(none) %}
            {% if raw is none %}
              {{ this.state }}
            {% else %}
              {% set last = this.state | float(none) %}
              {% set last_ts = this.attributes.get('last_accepted_ts', as_timestamp(this.last_updated)) | float(0) %}
              {% set now_ts = as_timestamp(trigger.to_state.last_updated)
                 if trigger.platform == 'state' else as_timestamp(now()) %}
              {% if last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}
                {{ raw }}
              {% else %}
                {% set hours = (now_ts - last_ts) / 3600 %}
                {% set limit = 3.0 if hours > 48 else [2.0 * hours, 0.1] | max %}
                {% set accepted = raw %}
                {% set spike_reject = raw > last * 3 and raw > 500 %}
                {% set upward_reject = raw - last > limit %}
                {% set downward_reject = last - raw > 0.2 %}
                {% if upward_reject or spike_reject %}
                  {% set accepted = last %}
                {% elif downward_reject %}
                  {% if is_state('sensor.watermeter_error', 'no error')
                     and is_state('binary_sensor.watermeter_problem', 'off')
                     and (last - raw) <= 5 %}
                    {% set prev_raw = this.attributes.get('last_raw_seen') | float(-999) %}
                    {% set confirm = this.attributes.get('raw_confirm_count', 0) | int %}
                    {% if (raw - prev_raw) | abs < 0.02 %}
                      {% set confirm = confirm + 1 %}
                    {% else %}
                      {% set confirm = 1 %}
                    {% endif %}
                    {% if confirm >= 3 %}
                      {% set accepted = raw %}
                    {% else %}
                      {% set accepted = last %}
                    {% endif %}
                  {% else %}
                    {% set accepted = last %}
                  {% endif %}
                {% endif %}
                {{ accepted }}
              {% endif %}
            {% endif %}
          {% endif %}
        attributes:
          source: sensor.watermeter_value
          raw_value: >
            {{ states('sensor.watermeter_value') if trigger.platform != 'state'
               else trigger.to_state.state }}
          korrektur_aktiv: >
            {{ states('input_number.watermeter_stabil_korrektur') | float(0) > 0 }}
          raw_confirm_count: >
            {% set korrektur = states('input_number.watermeter_stabil_korrektur') | float(0) %}
            {% if korrektur > 0 %}0{% else %}
            {% set raw = states('sensor.watermeter_value') | float(none)
               if trigger.platform != 'state'
               else trigger.to_state.state | float(none) %}
            {% set last = this.state | float(none) %}
            {% if raw is none or last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}0
            {% elif is_state('sensor.watermeter_error', 'no error')
               and is_state('binary_sensor.watermeter_problem', 'off')
               and last - raw > 0.2 and (last - raw) <= 5 %}
              {% set prev_raw = this.attributes.get('last_raw_seen') | float(-999) %}
              {% set confirm = this.attributes.get('raw_confirm_count', 0) | int %}
              {% if (raw - prev_raw) | abs < 0.02 %}{{ confirm + 1 }}{% else %}1{% endif %}
            {% else %}0{% endif %}{% endif %}
          last_raw_seen: >
            {% set raw = states('sensor.watermeter_value') | float(none)
               if trigger.platform != 'state'
               else trigger.to_state.state | float(none) %}
            {{ raw if raw is not none else this.attributes.get('last_raw_seen', '') }}
          filtered: >
            {% set korrektur = states('input_number.watermeter_stabil_korrektur') | float(0) %}
            {% if korrektur > 0 %}false{% else %}
            {% set raw = states('sensor.watermeter_value') | float(none)
               if trigger.platform != 'state'
               else trigger.to_state.state | float(none) %}
            {% set last = this.state | float(none) %}
            {% if raw is none or last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}
              false
            {% else %}
              {% set last_ts = this.attributes.get('last_accepted_ts', as_timestamp(this.last_updated)) | float(0) %}
              {% set now_ts = as_timestamp(trigger.to_state.last_updated)
                 if trigger.platform == 'state' else as_timestamp(now()) %}
              {% set hours = (now_ts - last_ts) / 3600 %}
              {% set limit = 3.0 if hours > 48 else [2.0 * hours, 0.1] | max %}
              {% set spike_reject = raw > last * 3 and raw > 500 %}
              {% set upward_reject = raw - last > limit %}
              {% set downward_reject = last - raw > 0.2 %}
              {% if upward_reject or spike_reject %}true
              {% elif downward_reject %}
                {% if is_state('sensor.watermeter_error', 'no error')
                   and is_state('binary_sensor.watermeter_problem', 'off')
                   and (last - raw) <= 5 %}
                  {% set prev_raw = this.attributes.get('last_raw_seen') | float(-999) %}
                  {% set confirm = this.attributes.get('raw_confirm_count', 0) | int %}
                  {% set confirm = confirm + 1 if (raw - prev_raw) | abs < 0.02 else 1 %}
                  {{ confirm < 3 }}
                {% else %}true{% endif %}
              {% else %}false{% endif %}
            {% endif %}{% endif %}
          last_accepted_ts: >
            {% set korrektur = states('input_number.watermeter_stabil_korrektur') | float(0) %}
            {% set now_ts = as_timestamp(trigger.to_state.last_updated)
               if trigger.platform == 'state' else as_timestamp(now()) %}
            {% if korrektur > 0 %}{{ now_ts }}{% else %}
            {% set raw = states('sensor.watermeter_value') | float(none)
               if trigger.platform != 'state'
               else trigger.to_state.state | float(none) %}
            {% set last = this.state | float(none) %}
            {% if raw is none %}
              {{ this.attributes.get('last_accepted_ts', now_ts) }}
            {% elif last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}
              {{ now_ts }}
            {% else %}
              {% set last_ts = this.attributes.get('last_accepted_ts', as_timestamp(this.last_updated)) | float(0) %}
              {% set hours = (now_ts - last_ts) / 3600 %}
              {% set limit = 3.0 if hours > 48 else [2.0 * hours, 0.1] | max %}
              {% set spike_reject = raw > last * 3 and raw > 500 %}
              {% set upward_reject = raw - last > limit %}
              {% set downward_reject = last - raw > 0.2 %}
              {% set accept = true %}
              {% if upward_reject or spike_reject %}
                {% set accept = false %}
              {% elif downward_reject %}
                {% if is_state('sensor.watermeter_error', 'no error')
                   and is_state('binary_sensor.watermeter_problem', 'off')
                   and (last - raw) <= 5 %}
                  {% set prev_raw = this.attributes.get('last_raw_seen') | float(-999) %}
                  {% set confirm = this.attributes.get('raw_confirm_count', 0) | int %}
                  {% if (raw - prev_raw) | abs < 0.02 %}
                    {% set confirm = confirm + 1 %}
                  {% else %}
                    {% set confirm = 1 %}
                  {% endif %}
                  {% set accept = confirm >= 3 %}
                {% else %}
                  {% set accept = false %}
                {% endif %}
              {% endif %}
              {{ now_ts if accept else last_ts }}
            {% endif %}{% endif %}

