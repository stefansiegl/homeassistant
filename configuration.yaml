          {% set ha_age_min = (as_timestamp(now()) - boot) / 60 if boot > 0 else 0 %}
          {% set val = states('sensor.watermeter_value') %}
          {% set live_lu = states.sensor.watermeter_uptime.last_updated
             if states('sensor.watermeter_uptime') not in ['unavailable', 'unknown', 'none', '']
             else states.sensor.watermeter_value.last_updated %}
          {% if ha_age_min < offline_min %}
            false
          {% elif live_lu is none %}
            {{ val in ['unavailable', 'unknown', 'none'] }}
          {% elif (as_timestamp(now()) - as_timestamp(live_lu)) / 60 > stale_min %}
            true
          {% elif val in ['unavailable', 'unknown', 'none'] %}
            false
          {% elif is_state('binary_sensor.watermeter_problem', 'on')
             and (as_timestamp(now()) - as_timestamp(states.binary_sensor.watermeter_problem.last_changed)) / 60 >= fehler_min %}
            true
          {% elif states('sensor.watermeter_error') not in ['no error', 'unavailable', 'unknown', 'none', ''] %}
            {% set e_min = (as_timestamp(now()) - as_timestamp(states.sensor.watermeter_error.last_changed)) / 60 %}
            {{ e_min >= fehler_min }}
          {% else %}
            false
          {% endif %}
        attributes:
          grund: >
            {% set stale_min = states('input_number.zaehler_stale_minuten') | int(45) %}
            {% set fehler_min = states('input_number.zaehler_fehler_minuten') | int(30) %}
            {% set offline_min = 5 %}
            {% set boot = states('sensor.ha_start_timestamp') | float(0) %}
            {% set ha_age_min = (as_timestamp(now()) - boot) / 60 if boot > 0 else 0 %}
            {% set val = states('sensor.watermeter_value') %}
            {% set live_lu = states.sensor.watermeter_uptime.last_updated
               if states('sensor.watermeter_uptime') not in ['unavailable', 'unknown', 'none', '']
               else states.sensor.watermeter_value.last_updated %}
            {% if ha_age_min < offline_min %}
            {% elif live_lu is none %}
              {% if val in ['unavailable', 'unknown', 'none'] %}
                Wasserzähler: Gerät offline
              {% endif %}
            {% else %}
              {% set age = ((as_timestamp(now()) - as_timestamp(live_lu)) / 60) | int %}
              {% if age > stale_min %}
                Wasserzähler: kein MQTT-Lebenszeichen seit {{ age }} Min
              {% elif is_state('binary_sensor.watermeter_problem', 'on') %}
                {% set p_min = ((as_timestamp(now()) - as_timestamp(states.binary_sensor.watermeter_problem.last_changed)) / 60) | int %}
