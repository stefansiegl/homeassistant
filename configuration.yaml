  # Energie-Kosten: inkrementell ΔVerbrauch × Preis (wie HA-Energy intern; this.state überlebt Neustart)
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.gasmeter_value_stabil
    sensor:
      - name: Gasmeter Stabil Kosten
        unique_id: gasmeter_stabil_kosten
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        icon: mdi:cash
        state: >
          {% if trigger.platform == 'homeassistant' %}
            {{ this.state | float(0) }}
          {% else %}
            {% set price = states('input_number.gaspreis_pro_m3') | float(0) %}
            {% set cur = states('sensor.gasmeter_value_stabil') | float(0) %}
            {% set prev = this.attributes.get('last_reading') | float(none) %}
            {% if prev is none %}
              {{ (cur * price) | round(2) }}
            {% else %}
              {% set delta = cur - prev %}
              {% if delta > 0 %}
                {{ (this.state | float(0) + delta * price) | round(2) }}
              {% else %}
                {{ this.state | float(0) }}
              {% endif %}
            {% endif %}
          {% endif %}
        attributes:
          last_reading: "{{ states('sensor.gasmeter_value_stabil') | float(0) }}"
