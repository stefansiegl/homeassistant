  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.gasmeter_value
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "Gasmeter Value Stabil"
        unique_id: gasmeter_value_stabil
