  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: time_pattern
        minutes: "/5"
      - trigger: state
        entity_id:
          - sensor.gasmeter_value
          - sensor.gasmeter_uptime
          - sensor.gasmeter_error
          - binary_sensor.gasmeter_problem
          - sensor.watermeter_value
          - sensor.watermeter_uptime
          - sensor.watermeter_error
          - binary_sensor.watermeter_problem
          - input_number.zaehler_stale_minuten
          - input_number.zaehler_fehler_minuten
          - sensor.ha_start_timestamp
    binary_sensor:
      - name: Gasmeter Warnung
        unique_id: gasmeter_warnung
        device_class: problem
        icon: mdi:gas-cylinder
        state: >
          {% set stale_min = states('input_number.zaehler_stale_minuten') | int(45) %}
          {% set fehler_min = [states('input_number.zaehler_fehler_minuten') | int(30), 60] | max %}
          {% set offline_min = 5 %}
          {% set boot = states('sensor.ha_start_timestamp') | float(0) %}
          {% set ha_age_min = (as_timestamp(now()) - boot) / 60 if boot > 0 else 0 %}
          {% set val = states('sensor.gasmeter_value') %}
          {% set live_lu = states.sensor.gasmeter_uptime.last_updated
             if states('sensor.gasmeter_uptime') not in ['unavailable', 'unknown', 'none', '']
             else states.sensor.gasmeter_value.last_updated %}
          {% if ha_age_min < offline_min %}
            false
          {% elif live_lu is none %}
            {{ val in ['unavailable', 'unknown', 'none'] }}
          {% elif (as_timestamp(now()) - as_timestamp(live_lu)) / 60 > stale_min %}
            true
          {% elif val in ['unavailable', 'unknown', 'none'] %}
            false
          {% elif is_state('binary_sensor.gasmeter_problem', 'on')
             and (as_timestamp(now()) - as_timestamp(states.binary_sensor.gasmeter_problem.last_changed)) / 60 >= fehler_min %}
            true
          {% elif states('sensor.gasmeter_error') not in ['no error', 'unavailable', 'unknown', 'none', '']
             and (as_timestamp(now()) - as_timestamp(states.sensor.gasmeter_error.last_changed)) / 60 >= fehler_min %}
            true
          {% else %}
            false
          {% endif %}
        attributes:
          grund: >
            {% set stale_min = states('input_number.zaehler_stale_minuten') | int(45) %}
            {% set fehler_min = states('input_number.zaehler_fehler_minuten') | int(30) %}
            {% set offline_min = 5 %}
            {% set boot = states('sensor.ha_start_timestamp') | float(0) %}
            {% set ha_age_min = (as_timestamp(now()) - boot) / 60 if boot > 0 else 0 %}
            {% set val = states('sensor.gasmeter_value') %}
            {% set live_lu = states.sensor.gasmeter_uptime.last_updated
               if states('sensor.gasmeter_uptime') not in ['unavailable', 'unknown', 'none', '']
               else states.sensor.gasmeter_value.last_updated %}
            {% if ha_age_min < offline_min %}
            {% elif live_lu is none %}
              {% if val in ['unavailable', 'unknown', 'none'] %}
                Gaszähler: Gerät offline
              {% endif %}
            {% else %}
              {% set age = ((as_timestamp(now()) - as_timestamp(live_lu)) / 60) | int %}
              {% if age > stale_min %}
                Gaszähler: kein MQTT-Lebenszeichen seit {{ age }} Min
              {% elif is_state('binary_sensor.gasmeter_problem', 'on') %}
                {% set p_min = ((as_timestamp(now()) - as_timestamp(states.binary_sensor.gasmeter_problem.last_changed)) / 60) | int %}
                {% if p_min >= fehler_min %}
                  Gaszähler: Geräteproblem seit {{ p_min }} Min
                {% endif %}
              {% elif states('sensor.gasmeter_error') not in ['no error', 'unavailable', 'unknown', 'none', ''] %}
                {% set e_min = ((as_timestamp(now()) - as_timestamp(states.sensor.gasmeter_error.last_changed)) / 60) | int %}
                {% if e_min >= fehler_min %}
                  Gaszähler: {{ states('sensor.gasmeter_error') }}
                {% endif %}
              {% endif %}
            {% endif %}
      - name: Watermeter Warnung
