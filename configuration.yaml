  - sensor:
      name: Energie Statistik Anomalie Anzahl
      unique_id: energie_statistik_anomalie_anzahl
      command: "sh /config/bin/check-energie-statistik-anomaly.sh --count"
      scan_interval: 3600
      value_template: "{{ value | int(0) }}"
  - sensor:
      name: Energie Statistik Anomalie Text
      unique_id: energie_statistik_anomalie_text
      command: "sh /config/bin/check-energie-statistik-anomaly.sh --message 2>/dev/null || true"
      scan_interval: 3600
      value_template: "{{ value | default('', true) }}"

shell_command:
