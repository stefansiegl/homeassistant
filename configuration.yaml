group:
  haus_warnungen_checks:
    name: Haus Warnungen Checks
    entities:
      - binary_sensor.gasmeter_warnung
      - binary_sensor.watermeter_warnung

template:
  # Wasserzähler: OCR-Ausreißer filtern (siehe docs/ai-on-the-edge.md)
  - trigger:
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: sensor.watermeter_value
      - trigger: time_pattern
        minutes: "/5"
    sensor:
      - name: "Watermeter Value Stabil"
        unique_id: watermeter_value_stabil
        icon: mdi:water-pump
        device_class: water
        state_class: total_increasing
        unit_of_measurement: m³
        availability: >
          {{ states('sensor.watermeter_value') not in ['unknown', 'unavailable', 'none']
             or this.state not in ['unknown', 'unavailable', 'none', ''] }}
        state: >
          {% set raw = states('sensor.watermeter_value') | float(none)
             if trigger.platform != 'state'
             else trigger.to_state.state | float(none) %}
          {% if raw is none %}
            {{ this.state }}
          {% else %}
            {% set last = this.state | float(none) %}
            {% set last_ts = this.attributes.get('last_accepted_ts', as_timestamp(this.last_updated)) | float(0) %}
            {% set now_ts = as_timestamp(trigger.to_state.last_updated)
               if trigger.platform == 'state' else as_timestamp(now()) %}
            {% if last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}
              {{ raw }}
            {% else %}
              {% set hours = (now_ts - last_ts) / 3600 %}
              {% set limit = 15.0 if hours > 48 else [2.0 * hours, 0.1] | max %}
              {% set accepted = raw %}
              {% if raw - last > limit or last - raw > 0.2 or (raw > last * 3 and raw > 500) %}
                {% set accepted = last %}
              {% endif %}
              {{ accepted }}
            {% endif %}
          {% endif %}
        attributes:
          source: sensor.watermeter_value
          raw_value: >
            {{ states('sensor.watermeter_value') if trigger.platform != 'state'
               else trigger.to_state.state }}
          filtered: >
            {% set raw = states('sensor.watermeter_value') | float(none)
               if trigger.platform != 'state'
               else trigger.to_state.state | float(none) %}
            {% set last = this.state | float(none) %}
            {% if raw is none or last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}
              false
            {% else %}
              {% set last_ts = this.attributes.get('last_accepted_ts', as_timestamp(this.last_updated)) | float(0) %}
              {% set now_ts = as_timestamp(trigger.to_state.last_updated)
                 if trigger.platform == 'state' else as_timestamp(now()) %}
              {% set hours = (now_ts - last_ts) / 3600 %}
              {% set limit = 15.0 if hours > 48 else [2.0 * hours, 0.1] | max %}
              {{ raw - last > limit or last - raw > 0.2 or (raw > last * 3 and raw > 500) }}
            {% endif %}
          last_accepted_ts: >
            {% set raw = states('sensor.watermeter_value') | float(none)
               if trigger.platform != 'state'
               else trigger.to_state.state | float(none) %}
            {% set last = this.state | float(none) %}
            {% set now_ts = as_timestamp(trigger.to_state.last_updated)
               if trigger.platform == 'state' else as_timestamp(now()) %}
            {% if raw is none %}
              {{ this.attributes.get('last_accepted_ts', now_ts) }}
            {% elif last is none or this.state in ['unknown', 'unavailable', 'none', ''] %}
              {{ now_ts }}
            {% else %}
              {% set last_ts = this.attributes.get('last_accepted_ts', as_timestamp(this.last_updated)) | float(0) %}
              {% set hours = (now_ts - last_ts) / 3600 %}
              {% set limit = 15.0 if hours > 48 else [2.0 * hours, 0.1] | max %}
              {% if raw - last > limit or last - raw > 0.2 or (raw > last * 3 and raw > 500) %}
                {{ last_ts }}
              {% else %}
                {{ now_ts }}
              {% endif %}
            {% endif %}

  # Gaszähler: OCR-Ausreißer filtern (siehe docs/ai-on-the-edge.md)
