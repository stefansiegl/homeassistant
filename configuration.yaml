      args:
        customer: !secret waste_collection_customer
        city: !secret waste_collection_city
        street: !secret waste_collection_street
      customize:
        - type: Restmülltonne
          alias: rest
        - type: Gelbe Tonne
          alias: gelb
        - type: Biotonne
          alias: bio
        - type: Papiertonne
          alias: papier
  fetch_time: "04:00"
  day_switch_time: "08:00"

