# ---------------------------------------------------------
# EXTENSIONS (Waste Collection Integration)
# ---------------------------------------------------------

waste_collection_schedule:
  sources:
    - name: awido_de
      args:
        customer: !secret waste_collection_customer
        city: !secret waste_collection_city
        street: !secret waste_collection_street
      customize:
        - type: Restmülltonne
          alias: rest
        - type: Gelbe Tonne
          alias: gelb
        - type: Biotonne
          alias: bio
        - type: Papiertonne
          alias: papier
  fetch_time: "04:00"
  day_switch_time: "08:00"

# ---------------------------------------------------------
# POWERCALC (Automatische Stromberechnung)
# ---------------------------------------------------------

powercalc:
  discovery:
    enabled: true
  create_energy_sensors: true
  create_domain_groups:
    - light
  sensors:
    - entity_id: fan.helios
      name: Helios Lüftung
      linear:
        calibrate:
          - 0 -> 3
          - 10 -> 35
          - 50 -> 70
          - 75 -> 100
          - 100 -> 125

logger:
  default: info
