# ---------------------------------------------------------

powercalc:
  discovery:
    enabled: true
  create_energy_sensors: true
  create_domain_groups:
    - light
  sensors:
    - entity_id: fan.helios
      name: Helios Lüftung
      linear:
        calibrate:
          - 0 -> 3
          - 10 -> 35
          - 50 -> 70
          - 75 -> 100
          - 100 -> 125

