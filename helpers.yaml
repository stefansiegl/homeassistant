# Kombinationssensor: max CO2 aller Aranet-Sensoren im Haus
template:
  - sensor:
      - name: House Max CO2
        unique_id: house_max_co2
        icon: mdi:calculator
        device_class: carbon_dioxide
        unit_of_measurement: ppm
        state_class: measurement
        state: >
          {% set ns = namespace(values=[]) %}
          {% for s in [
            'sensor.aranet4_01_arbeitszimmer_carbon_dioxide',
            'sensor.aranet4_02_kueche_carbon_dioxide',
            'sensor.c9_46_fc_e8_90_d9_carbon_dioxide',
            'sensor.db_04_e6_6d_44_0d_carbon_dioxide'
          ] %}
            {% set v = states(s) %}
            {% if v not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.values = ns.values + [v | float(0)] %}
            {% endif %}
          {% endfor %}
          {% if ns.values | length == 0 %}
            unavailable
          {% else %}
            {{ ns.values | max | round(2) }}
          {% endif %}
        availability: >
          {% set ns = namespace(ok=false) %}
          {% for s in [
            'sensor.aranet4_01_arbeitszimmer_carbon_dioxide',
            'sensor.aranet4_02_kueche_carbon_dioxide',
            'sensor.c9_46_fc_e8_90_d9_carbon_dioxide',
            'sensor.db_04_e6_6d_44_0d_carbon_dioxide'
          ] %}
            {% if states(s) not in ['unknown', 'unavailable', 'none', ''] %}
              {% set ns.ok = true %}
            {% endif %}
          {% endfor %}
          {{ ns.ok }}
  - binary_sensor:
      - name: Humidifier EG Empty
        unique_id: humidifier_eg_empty
        device_class: problem
        state: "{{ is_state_attr('humidifier.deerma_jsq2w_a365_humidifier', 'water_shortage_fault', 'on') }}"
      - name: Humidifier 1.OG Empty
        unique_id: humidifier_1_og_empty
        device_class: problem
        state: "{{ is_state_attr('humidifier.deerma_jsq2w_7134_humidifier', 'water_shortage_fault', 'on') }}"
      - name: Humidifier 2.OG Empty
        unique_id: humidifier_2_og_empty
        device_class: problem
        state: "{{ is_state_attr('humidifier.deerma_jsq2w_b6e0_humidifier', 'water_shortage_fault', 'on') }}"
      - name: Befeuchter nicht erreichbar
        unique_id: befeuchter_nicht_erreichbar
        device_class: connectivity
        state: >
          {% if not is_state('input_boolean.befeuchter_saison_aktiv', 'on') %}
            false
          {% else %}
            {% set ns = namespace(found=false) %}
            {% for eid in [
              'humidifier.deerma_jsq2w_a365_humidifier',
              'humidifier.deerma_jsq2w_7134_humidifier',
              'humidifier.deerma_jsq2w_b6e0_humidifier',
            ] %}
              {% if states(eid) in ['unavailable', 'unknown'] %}
                {% set ns.found = true %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}
          {% endif %}
        attributes:
          grund: >
            {% if not is_state('input_boolean.befeuchter_saison_aktiv', 'on') %}
              
            {% else %}
              {% set offline = namespace(names=[]) %}
              {% for eid in [
                'humidifier.deerma_jsq2w_a365_humidifier',
                'humidifier.deerma_jsq2w_7134_humidifier',
                'humidifier.deerma_jsq2w_b6e0_humidifier',
              ] %}
                {% if states(eid) in ['unavailable', 'unknown'] %}
                  {% set offline.names = offline.names + [state_attr(eid, 'friendly_name') | default(eid)] %}
                {% endif %}
              {% endfor %}
              {% if offline.names | length > 0 %}
                Befeuchter offline: {{ offline.names | join(', ') }}
              {% endif %}
            {% endif %}
